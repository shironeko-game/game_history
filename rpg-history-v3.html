<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>GAME LOG — RPG</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,900&display=swap">
<style>
  :root{
    --bg:#100E14;
    --panel:#1B1723;
    --border-soft:#2A2534;
    --text:#F3F0F5;
    --sub:#948DA3;
    --played:#7FC8D9;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -5%, rgba(185,139,224,0.08), transparent),
      var(--bg);
    color:var(--text);
    font-family:'Zen Kaku Gothic New','Inter',sans-serif;
    min-height:100vh;
    padding-bottom:40px;
  }

  header{
    position:sticky;top:0;z-index:30;
    padding:12px 20px 10px;
    background:rgba(16,14,20,0.94);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border-soft);
  }
  .header-top{display:flex;align-items:baseline;justify-content:space-between;}
  h1{
    font-family:'Fraunces',serif;font-weight:900;font-size:16px;
    font-style:italic;letter-spacing:0.01em;color:var(--sub);
  }
  .genre-heading-title{
    font-family:'Fraunces',serif;font-weight:700;font-size:20px;font-style:italic;
    background:linear-gradient(90deg, #fff, var(--played));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .genre-heading-count{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--sub);}

  .epithet-filter{
    display:flex;gap:6px;margin-top:10px;overflow-x:auto;padding-bottom:2px;
    scrollbar-width:none;
  }
  .epithet-filter::-webkit-scrollbar{display:none;}
  .epithet-chip{
    flex-shrink:0;font-family:'Inter',sans-serif;font-weight:600;font-size:10px;
    letter-spacing:0.02em;white-space:nowrap;cursor:pointer;
    padding:5px 10px;border-radius:999px;
    background:transparent;transition:all 0.15s ease;
    opacity:0.55;
  }
  .epithet-chip.active{opacity:1;}
  .epithet-chip.all-toggle{
    position:sticky;left:0;z-index:1;
    background:var(--panel);border:1px solid var(--border-soft);
    color:var(--text);opacity:1;
  }

  main{
    background:var(--bg);
  }

  /* ---- 上段: 本流タイトルの行（横スクロールのみ、画面上部に固定） ---- */
  .main-row-outer{
    position:sticky;top:0;z-index:20;
    overflow-x:auto;overflow-y:hidden;
    background:var(--bg);
    border-bottom:1px solid var(--border-soft);
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .main-row-outer::-webkit-scrollbar{display:none;}
  .main-row-inner{
    position:relative;width:max-content;
  }

  /* ---- 下段: 後継作カードのエリア（縦横スクロール可能） ---- */
  .branch-area-outer{
    overflow-x:auto;overflow-y:hidden;
    -webkit-overflow-scrolling:touch;
    padding-top:16px;
    scrollbar-width:none;
  }
  .branch-area-outer::-webkit-scrollbar{display:none;}
  .branch-area-inner{
    position:relative;width:max-content;
  }

  .scroll-hint{
    display:flex;align-items:center;gap:6px;padding:8px 20px 0;
    font-size:10px;color:var(--sub);font-family:'JetBrains Mono',monospace;
  }

  svg.lines{position:absolute;top:0;left:0;pointer-events:none;}

  .main-node{
    position:absolute;transform:translateX(-50%);
    display:flex;flex-direction:column;align-items:center;
    width:168px;z-index:2;cursor:pointer;
    transition:opacity 0.2s ease, filter 0.2s ease;
  }
  .main-node.dimmed{opacity:0.28;filter:grayscale(0.6);}
  .branch-node.dimmed{opacity:0.22;filter:grayscale(0.6);}
  .line-dimmed{opacity:0.15 !important;}
  .main-dot{
    width:17px;height:17px;border-radius:50%;
    border:3px solid var(--bg);
    cursor:pointer;position:relative;z-index:6;
  }
  .main-dot.played{box-shadow:0 0 0 3px rgba(127,200,217,0.3);}
  .main-dot.todo{box-shadow:0 0 0 3px rgba(255,255,255,0.14);}

  .main-year{
    font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--sub);
    margin-top:8px;
  }
  .main-title{
    font-family:'Fraunces',serif;font-weight:700;font-size:14px;line-height:1.3;
    text-align:center;margin-top:4px;color:#FFFFFF;cursor:pointer;
    height:38px;overflow:hidden;
  }
  .main-epithet{
    font-family:'Inter',sans-serif;font-weight:600;font-size:8.5px;
    letter-spacing:0.02em;text-align:center;margin-top:3px;
    padding:2px 8px;border-radius:999px;
    white-space:nowrap;
  }
  .main-status{
    margin-top:6px;width:20px;height:20px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    background:rgba(255,255,255,0.08);color:var(--sub);
  }
  .main-status.played{background:rgba(127,200,217,0.24);color:var(--played);}
  .main-status svg{width:10px;height:10px;}

  .main-note{
    width:168px;height:76px;font-size:9.5px;line-height:1.55;color:#F0EDF4;
    text-align:center;margin-top:8px;
    background:#241E2F;
    border:1px solid #3A3248;
    border-radius:8px;
    position:relative;z-index:2;
    overflow:hidden;
  }
  .main-note-inner{
    padding:8px 9px;
  }
  .main-note::after{
    content:'';position:absolute;left:0;right:0;bottom:0;height:18px;
    background:linear-gradient(to bottom, transparent, #241E2F);
  }
  .main-note b{color:#fff;font-weight:700;}

  .branch-node{
    position:absolute;transform:translateX(-50%);
    width:126px;text-align:center;cursor:pointer;z-index:2;
    transition:opacity 0.2s ease, filter 0.2s ease;
  }
  .branch-card{
    background:#1B1723;border:1px solid var(--border-soft);
    border-radius:8px;padding:9px 9px 10px;border-top-width:3px;
  }
  .branch-dot{
    width:8px;height:8px;border-radius:50%;
    margin:0 auto 5px;position:relative;z-index:6;
    border:2px solid var(--bg);
  }
  .branch-year{
    font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--sub);
  }
  .branch-title{
    font-family:'Zen Kaku Gothic New',sans-serif;font-weight:700;font-size:11.5px;
    line-height:1.35;color:#FFFFFF;margin-top:3px;
    height:31px;overflow:hidden;
  }
  .branch-note{
    font-size:9.5px;line-height:1.6;color:#C7C1D1;margin-top:5px;
    height:46px;overflow:hidden;
  }

  .empty{text-align:center;padding:60px 20px;color:var(--sub);font-size:13px;}

  /* ---- 詳細ダイアログ ---- */
  .detail-overlay{
    position:fixed;inset:0;z-index:100;
    background:rgba(8,7,11,0.72);
    backdrop-filter:blur(6px);
    display:flex;align-items:flex-end;justify-content:center;
    opacity:0;pointer-events:none;
    transition:opacity 0.22s ease;
  }
  .detail-overlay.open{opacity:1;pointer-events:auto;}
  .detail-sheet{
    position:relative;
    width:100%;max-width:520px;max-height:82vh;overflow-y:auto;
    background:var(--panel);
    border-top-left-radius:20px;border-top-right-radius:20px;
    border:1px solid var(--border-soft);border-bottom:none;
    padding:0 0 28px;
    transform:translateY(24px);
    transition:transform 0.24s ease;
    -webkit-overflow-scrolling:touch;
  }
  .detail-overlay.open .detail-sheet{transform:translateY(0);}
  .detail-handle{
    width:36px;height:4px;border-radius:999px;background:var(--border-soft);
    margin:10px auto 6px;
  }
  .detail-accent{
    width:100%;height:6px;
  }
  .detail-close{
    position:absolute;top:10px;right:10px;z-index:2;
    width:30px;height:30px;border-radius:50%;
    background:rgba(255,255,255,0.08);
    display:flex;align-items:center;justify-content:center;
    color:#fff;border:none;cursor:pointer;
  }
  .detail-info-link-wrap{margin-top:12px;}
  .detail-info-link{
    display:inline-flex;align-items:center;gap:6px;
    font-family:'Inter',sans-serif;font-weight:600;font-size:11px;
    color:var(--played);text-decoration:none;
    padding:7px 12px;border-radius:8px;
    background:rgba(255,255,255,0.05);
    border:1px solid var(--border-soft);
  }
  .detail-video-wrap{
    position:relative;width:100%;aspect-ratio:16/9;
    background:#000;overflow:hidden;
  }
  .detail-video-wrap iframe{
    position:absolute;top:0;left:0;width:100%;height:100%;border:0;
  }
  .detail-video-caption{
    padding:8px 20px 0;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--sub);
  }
  .detail-video-caption span{flex:1;min-width:0;}
  .detail-video-link{
    flex-shrink:0;display:inline-flex;align-items:center;gap:4px;
    font-family:'Inter',sans-serif;font-weight:600;font-size:10px;
    color:var(--played);text-decoration:none;
    padding:4px 9px;border-radius:6px;
    background:rgba(255,255,255,0.06);
    white-space:nowrap;
  }
  .detail-body{padding:18px 20px 4px;}
  .detail-title{
    font-family:'Fraunces',serif;font-weight:700;font-size:21px;
    color:#fff;line-height:1.3;
  }
  .detail-epithet{
    display:inline-block;margin-top:10px;
    font-family:'Inter',sans-serif;font-weight:600;font-size:10.5px;
    padding:3px 10px;border-radius:999px;
  }
  .detail-meta{
    margin-top:12px;display:flex;align-items:center;flex-wrap:wrap;gap:7px;
    font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--sub);
  }
  .detail-meta-item{
    display:flex;align-items:center;gap:5px;
    background:rgba(255,255,255,0.05);
    padding:4px 9px;border-radius:6px;
  }
  .detail-meta-label{
    font-family:'Inter',sans-serif;font-size:8.5px;font-weight:700;
    color:var(--sub);opacity:0.65;
  }
  .detail-section{
    margin-top:18px;padding-top:14px;border-top:1px solid var(--border-soft);
  }
  .detail-section-label{
    font-family:'Inter',sans-serif;font-weight:700;font-size:10px;
    letter-spacing:0.04em;text-transform:uppercase;color:var(--sub);
  }
  .detail-section-body{
    margin-top:7px;font-size:13.5px;line-height:1.75;color:#E4E0EC;
  }
  .detail-section-body b{color:#fff;}
  .detail-trivia .detail-section-label{color:var(--played);}
</style>
</head>
<body>

<header>
  <div class="header-top">
    <h1>GAME LOG</h1>
    <div style="display:flex;align-items:baseline;gap:8px;">
      <div class="genre-heading-title">RPG</div>
      <div class="genre-heading-count" id="genreCount"></div>
    </div>
  </div>
  <div class="epithet-filter" id="epithetFilter"></div>
</header>

<main>
  <div class="main-row-outer" id="mainRowOuter">
    <div class="main-row-inner" id="mainRowInner"></div>
  </div>
  <div class="scroll-hint">← 横スクロールで年代を辿れます。系譜は下にスクロール</div>
  <div class="branch-area-outer" id="branchAreaOuter">
    <div class="branch-area-inner" id="branchAreaInner"></div>
  </div>
</main>

<div class="detail-overlay" id="detailOverlay" onclick="closeDetailOnOverlay(event)">
  <div class="detail-sheet" id="detailSheet">
    <div class="detail-handle"></div>
    <div id="detailContent"></div>
  </div>
</div>

<script>
const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
const ICON_CLOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>';

// 系列ごとの識別色（本流ノード・接続線・後継カードの上辺に使用）
const LINEAGE_COLORS = [
  "#B98BE0", // Wizardry系（3Dダンジョン探索の始祖）
  "#6BE8C4", // Ultima系（フィールド探索・自由度）

  "#E88D6B", // ドラゴンクエスト系（国産RPGの大衆化）

  "#8D6BE8", // 女神転生系（和製ダークファンタジー）
  "#6BE88D", // ゼルダの伝説系（アクションRPG・オープンワールド）
  "#E8C36B", // クロノ・トリガー系（物語構造の革新）
  "#C46BE8", // タクティクスオウガ/FE系（シミュレーションRPG）
  "#E86BAA", // ポケットモンスター系（収集・対戦育成）
  "#E86B4A", // Diablo系（ハクスラ・アクションRPG）
  "#6BE8A8", // Baldur's Gate系（CRPG・対話選択）
  "#4AA8E8", // World of Warcraft系（MMORPG）
  "#A8E86B", // The Elder Scrolls系（オープンワールドRPG）
  "#E86B8D", // Dark Souls系（ソウルライク）
  "#C4A8E8", // Undertale/Disco Elysium系（インディー・実験的RPG）
  "#E8B36B", // スーパーマリオRPG系（タイミングアクション戦闘）
  "#B3E86B", // パズル&ドラゴンズ系（ガチャ・モバイルRPG）
  "#6BC4E8", // 原神系（二次元系オープンワールドRPG）
  "#D06BE8", // Vampire Survivors系（サバイバーライク）
  "#6B8DE8", // Fallout系（ポストアポカリプスRPG）
  "#8DE86B"  // ドラッグオンドラグーン/ニーア系（実存主義・鬱系RPG）
];

// RPGジャンルの主軸16系列。descendants = ジャンルに新しい意義をもたらした転換点。各系列に「傑作」と「最新作」を含む。
let games = [
  {
    id: 1, title: "Wizardry", year: 1981, platform: "Apple II", meta: null, status: "todo",
    epithet: "3Dダンジョン探索の始祖",
    significance: "<b>RPGの始祖。</b>3Dダンジョン探索と成長システムの原型を確立。",
    developer: "Sir-Tech",
    about: "6人パーティで3Dダンジョンに挑む一人称視点RPG。仲間の死が二度と戻らない緊張感と、地図を自分の手で描く手探りの探索体験が特徴。",
    trivia: "国内では発売元PC-8801版などを通じ、堀井雄二・坂口博信ら後のドラクエ／FF開発者に直接的な影響を与えた。",
    youtubeId: "VyM9tmAqV3M", videoSource: "officialish", videoCredit: "Digital Eclipse (2023年リメイク版トレーラー)",
    descendants: [
      { title: "Wizardry #4", year: 1987, platform: "Apple II", developer: "Sir-Tech",
        note: "ラスボス側を操作する異色作",
        about: "シリーズ第1作のラスボス・Werdnaを操作し、侵入者を返り討ちにする逆転の発想で作られた異色作。当時としては前代未聞のプレイヤー体験を提供した。",
        trivia: "難易度が非常に高く、シリーズ随一の「クソゲー」「良作」と評価が二分される問題作としても知られる。" },
      { title: "New Wizardry (#6-8)", year: 1990, platform: "PC-98", developer: "Sir-Tech",
        note: "屋外探索を導入し常識を刷新",
        about: "「Bane of the Cosmic Forge」から始まる新3部作。ダンジョンに加え、初めて地上フィールドの探索が導入され、シリーズの遊びの幅を大きく広げた。",
        trivia: "" },
      { title: "不思議のダンジョン", year: 1993, platform: "SFC", developer: "チュンソフト",
        note: "国産で独自の探索型に発展。傑作系譜の起点",
        about: "『トルネコの大冒険』として登場した、日本発の独自ローグライク。1歩進むごとにダンジョンの配置が変わる緊張感と、失敗すればゼロからやり直すハイリスクな探索を確立した。",
        trivia: "後に「不思議のダンジョン」シリーズとして多数の派生作を生み、和製ローグライクの源流となった。" },
      { title: "Wizardry Variants Daphne", year: 2023, platform: "iOS/Android", developer: "ドリコム",
        note: "現代のスマホ向けに再構築した最新作",
        about: "原点のダンジョン探索とパーティ育成をスマートフォン向けに再構築したソーシャルRPG。シリーズ40年以上の歴史を現代の遊び方に橋渡しした作品。",
        trivia: "" }

  },
  {
    id: 2, title: "Ultima", year: 1981, platform: "Apple II", meta: null, status: "todo",
    epithet: "自由探索とMMOの源流",
    significance: "広大なフィールド探索と自由度・物語性を切り開いた元祖。",
    developer: "Origin Systems",
    about: "見下ろし型のフィールドマップを自由に歩き回れる、初期RPGの中でも特に開放的な世界観を持つ作品。宇宙船での戦闘など、当時としては異色の要素も詰め込まれていた。",
    trivia: "国産RPGの多くがフィールド移動・街・ダンジョンという構成を踏襲しており、その原型はUltimaに遡るとされる。",
    infoUrl: "https://en.wikipedia.org/wiki/Ultima_I:_The_First_Age_of_Darkness", infoLabel: "Wikipediaで見る",
    descendants: [
      { title: "Ultima IV", year: 1985, platform: "Apple II", developer: "Origin Systems",
        note: "「徳」という倫理システムを導入。傑作の呼び声高い",
        about: "敵を倒すだけでなく、8つの美徳を体現することでゲームクリアを目指す、当時としては異例の倫理観を主題にしたRPG。単なる勧善懲悪ではない哲学的なテーマが評価された。",
        trivia: "この「徳」のシステムはシリーズの根幹となり、以降のUltima作品全体を貫くテーマとなった。" },
      { title: "Ultima VII", year: 1992, platform: "MS-DOS", developer: "Origin Systems",
        note: "生きた世界のシミュレーションを追求",

        trivia: "" },
      { title: "Ultima Online", year: 1997, platform: "PC", developer: "Origin Systems",
        note: "MMORPGの先駆け。本編はIXで完結し新作なし",
        about: "数千人が同じ仮想世界を同時に共有する、商業的に成功した初期のMMORPG。プレイヤー同士の経済活動やハウジングなど、後のオンラインゲームの型を築いた。",
        trivia: "シリーズ本編は1999年のUltima IXで終了しており、以降新作は出ていない。" }
    ]
  },
  {
    id: 3, title: "Rogue", year: 1980, platform: "UNIX", meta: null, status: "todo",
    epithet: "ローグライクの起点",
    significance: "<b>ローグライクの起点。</b>毎回変化するダンジョンと死の緊張感を確立。",
    developer: "Michael Toy, Glenn Wichman",
    about: "プレイするたびにダンジョンの構造がランダムに生成され、一度死ぬとセーブデータが消える「一回きり」の緊張感を特徴とするテキストベースの探索ゲーム。",
    trivia: "この作品名から「ローグライク」というジャンル名そのものが生まれた。",
    infoUrl: "https://en.wikipedia.org/wiki/Rogue_(video_game)", infoLabel: "Wikipediaで見る",
    descendants: [
      { title: "トルネコの大冒険", year: 1993, platform: "SFC", developer: "チュンソフト",
        note: "国内にローグライクを広めた",
        about: "ドラゴンクエストの世界観を借りつつ、Rogueの「一度死んだら最初から」という緊張感を日本のプレイヤーに広めた作品。以後「不思議のダンジョン」シリーズとして展開された。",
        trivia: "",

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// 選択中の主流ID集合。空集合＝フィルタなし（全部通常表示）
let activeFilter = new Set();

function toggleFilter(id, event){
  if(event) event.stopPropagation();
  if(activeFilter.has(id)) activeFilter.delete(id);
  else activeFilter.add(id);
  render();
}

// 全バッジをオン（絞り込みなし＝全表示）にする、または現在何か絞り込み中なら解除する
function toggleAllFilter(event){
  if(event) event.stopPropagation();
  activeFilter.clear();
  render();
}

function toggleStatus(id, event){
  if(event) event.stopPropagation();
  const g = games.find(x => x.id === id);
  g.status = g.status === "played" ? "todo" : "played";
  render();
}

// ---- 詳細ダイアログ ----
function openMainDetail(id, event){
  if(event) event.stopPropagation();
  const g = games.find(x => x.id === id);
  if(!g) return;
  showDetail({
    title: g.title,
    year: g.year,
    platform: g.platform,
    epithet: g.epithet,
    positioning: g.significance,
    developer: g.developer || '',
    about: g.about || '',
    trivia: g.trivia || '',
    youtubeId: g.youtubeId || '',
    videoSource: g.videoSource || '',
    videoCredit: g.videoCredit || '',
    infoUrl: g.infoUrl || '',
    infoLabel: g.infoLabel || '',
    color: colorForId(g.id)
  });
}

function openBranchDetail(seriesId, year, event){
  if(event) event.stopPropagation();
  const g = games.find(x => x.id === seriesId);
  if(!g) return;
  const d = g.descendants.find(x => x.year === year);
  if(!d) return;
  showDetail({
    title: d.title,
    year: d.year,
    platform: d.platform || '',
    epithet: '',
    positioning: d.note,
    developer: d.developer || '',
    about: d.about || '',
    trivia: d.trivia || '',
    youtubeId: d.youtubeId || '',
    videoSource: d.videoSource || '',
    videoCredit: d.videoCredit || '',
    infoUrl: d.infoUrl || '',
    infoLabel: d.infoLabel || '',
    color: colorForId(g.id)
  });
}

function showDetail(info){
  const content = document.getElementById('detailContent');
  const epithetHtml = info.epithet
    ? `<div class="detail-epithet" style="background:${info.color}22; color:${info.color}; border:1px solid ${info.color}55;">${esc(info.epithet)}</div>`
    : '';

  // 参考リンク: 動画がない場合の代替。画像を直接埋め込まず、外部サイトへのリンクのみ表示（権利者の意図を尊重）
  const infoLinkHtml = (!info.youtubeId && info.infoUrl)
    ? `<div class="detail-info-link-wrap">
        <a href="${esc(info.infoUrl)}" target="_blank" rel="noopener noreferrer" class="detail-info-link">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><path d="M21 15l-5-5L5 21"></path></svg>
          ${esc(info.infoLabel || '作品情報を見る')}
          <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M17 7H8M17 7V16"></path></svg>
        </a>
      </div>`
    : '';

  // 動画: YouTube埋め込み（youtubeIdがある場合のみ表示）。出典種別に応じてラベルを添える。
  const VIDEO_SOURCE_LABELS = {
    official: '公式トレーラー',
    officialish: '公式配信元による映像',
    thirdparty: 'プレイ映像'
  };
  const videoHtml = info.youtubeId
    ? `<div class="detail-video-wrap">
        <iframe src="https://www.youtube-nocookie.com/embed/${esc(info.youtubeId)}"
          title="${esc(info.title)} video" frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen loading="lazy"></iframe>
      </div>
      <div class="detail-video-caption">
        <span>${esc(VIDEO_SOURCE_LABELS[info.videoSource] || 'プレイ映像')}${info.videoCredit ? ` ・ 提供: ${esc(info.videoCredit)}` : ''}</span>
        <a href="https://www.youtube.com/watch?v=${esc(info.youtubeId)}" target="_blank" rel="noopener noreferrer" class="detail-video-link">
          YouTubeで開く
          <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M17 7H8M17 7V16"></path></svg>
        </a>
      </div>`
    : '';

  // 項目1: 開発元 / 発売年 / プラットフォーム（各項目にラベルを付けて何の情報か明示）
  const metaParts = [];
  if(info.developer) metaParts.push(`<span class="detail-meta-label">開発</span>${esc(info.developer)}`);
  metaParts.push(`<span class="detail-meta-label">発売</span>${info.year}年`);
  if(info.platform) metaParts.push(`<span class="detail-meta-label">機種</span>${esc(info.platform)}`);
  const metaHtml = `<div class="detail-meta">${metaParts.map(m => `<span class="detail-meta-item">${m}</span>`).join('')}</div>`;

  // 項目2: 系譜内での位置づけ
  const positioningHtml = info.positioning
    ? `<div class="detail-section">
        <div class="detail-section-label">系譜内での位置づけ</div>
        <div class="detail-section-body">${info.positioning}</div>
      </div>`
    : '';

  // 項目3: どんなゲームか
  const aboutHtml = info.about
    ? `<div class="detail-section">
        <div class="detail-section-label">どんなゲームか</div>
        <div class="detail-section-body">${esc(info.about)}</div>
      </div>`
    : '';

  // 項目4: 豆知識・評価（あれば表示）
  const triviaHtml = info.trivia
    ? `<div class="detail-section detail-trivia">
        <div class="detail-section-label">豆知識</div>
        <div class="detail-section-body">${esc(info.trivia)}</div>
      </div>`
    : '';

  content.innerHTML = `
    <button class="detail-close" onclick="closeDetail(event)" aria-label="閉じる">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
    ${videoHtml || `<div class="detail-accent" style="background:${info.color};"></div>`}
    <div class="detail-body">
      <div class="detail-title">${esc(info.title)}</div>
      ${epithetHtml}
      ${metaHtml}
      ${infoLinkHtml}
      ${positioningHtml}
      ${aboutHtml}
      ${triviaHtml}
    </div>
  `;
  document.getElementById('detailOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeDetail(event){
  if(event) event.stopPropagation();
  document.getElementById('detailOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

function closeDetailOnOverlay(event){
  if(event.target.id === 'detailOverlay') closeDetail(event);
}

// ---- layout constants ----
const YEAR_PX = 90;
const PAD_YEARS = 1.2;
const MAIN_NODE_GAP = 214;   // 本流ノード全体の縦幅（epithetバッジ追加分+26px、行内でのドット位置に使用）
const BRANCH_ROW_H = 148;    // レーン1本あたりの縦間隔（後継カードの実高さに合わせて再計算）
const MIN_MAIN_X_GAP = 210;  // 本流ノード同士の最小横間隔（直下の後継作カード幅+余白を確保）
const BRANCH_CARD_W = 126;   // 後継作カードの幅（CSSと一致させる）

function yearToX(year, minYear){
  return (year - minYear + PAD_YEARS) * YEAR_PX;
}

// idを基準に固定の系列色を返す（定義順・年代順に依存させず一貫性を保つ）
function colorForId(id){
  return LINEAGE_COLORS[(id - 1) % LINEAGE_COLORS.length];
}

function render(){
  document.getElementById('genreCount').textContent = games.length + ' TITLES';

  // epithetフィルタチップの描画（先頭に全表示トグルを固定表示）
  const filterEl = document.getElementById('epithetFilter');
  const allChip = `<button class="epithet-chip all-toggle" onclick="toggleAllFilter(event)">
      ${activeFilter.size === 0 ? 'すべて表示中' : `絞り込み解除 (${activeFilter.size})`}
    </button>`;
  const badgeChips = games.map((g) => {
    const color = colorForId(g.id);
    const isActive = activeFilter.size === 0 || activeFilter.has(g.id);
    return `<button class="epithet-chip ${isActive ? 'active' : ''}"
        style="background:${color}22; color:${color}; border:1px solid ${color}55;"
        onclick="toggleFilter(${g.id}, event)">${esc(g.epithet)}</button>`;
  }).join('');
  filterEl.innerHTML = allChip + badgeChips;

  const allYears = [];
  games.forEach(g => {
    allYears.push(g.year);
    g.descendants.forEach(d => allYears.push(d.year));
  });
  const minYear = Math.min(...allYears);
  const maxYear = Math.max(...allYears);

  const sorted = [...games].sort((a,b) => a.year - b.year);

  // 本流ノードのX座標（最小間隔を確保）
  const mainX = [];
  sorted.forEach((g, i) => {
    let x = yearToX(g.year, minYear);
    if(i > 0){
      x = Math.max(x, mainX[i-1] + MIN_MAIN_X_GAP);
    }
    mainX.push(x);
  });

  // 各系列の後継作は、本流タイトルの真下に固定X（本流と同じX座標）で縦一列に年代順で並べる。
  const allBranches = [];
  sorted.forEach((g, gi) => {
    const mainXPos = mainX[gi];
    const color = colorForId(g.id);
    const descSorted = [...g.descendants].sort((a,b) => a.year - b.year);
    descSorted.forEach((d, di) => {
      allBranches.push({
        ...d, x: mainXPos, color, seriesIndex: gi, lane: di
      });
    });
  });

  let maxBranchRows = 1;
  sorted.forEach(g => { maxBranchRows = Math.max(maxBranchRows, g.descendants.length); });
  const laneCount = maxBranchRows;

  const contentWidth = Math.max(
    (maxYear - minYear + PAD_YEARS * 2) * YEAR_PX,
    mainX[mainX.length - 1] + 220
  ); // yearToXのPAD_YEARSで左余白、末尾ノード+220pxで右余白を確保済み

  // ---- 上段（本流固定行）: 意義カード＋タイトル＋バッジ＋丸のみを描画 ----
  const MAIN_ROW_H = MAIN_NODE_GAP + 30; // 意義カードからステータスアイコンまでの実高さ+余白
  let mainNodesHtml = '';
  let mainAxisSvg = '';
  const dotY = MAIN_NODE_GAP; // 行内でのドットのY位置（意義カード＋タイトル分だけ下）

  for(let i = 0; i < sorted.length - 1; i++){
    mainAxisSvg += `<line x1="${mainX[i]}" y1="${dotY}" x2="${mainX[i+1]}" y2="${dotY}"
      stroke="#4A4258" stroke-width="2.5" />`;
  }

  sorted.forEach((g, gi) => {
    const played = g.status === "played";
    const x = mainX[gi];
    const color = colorForId(g.id);
    const isActive = activeFilter.size === 0 || activeFilter.has(g.id);

    mainNodesHtml += `<div class="main-node ${isActive ? '' : 'dimmed'}" style="left:${x}px; top:0px;" onclick="openMainDetail(${g.id}, event)">
      <div class="main-note"><div class="main-note-inner">${g.significance}</div></div>
      <div class="main-year">${g.year}</div>
      <div class="main-title">${esc(g.title)}</div>
      <div class="main-epithet" style="background:${color}22; color:${color}; border:1px solid ${color}55;">${esc(g.epithet)}</div>
      <div class="main-dot ${played?'played':'todo'}" style="background:${color}" onclick="toggleStatus(${g.id}, event)"></div>
      <div class="main-status ${played?'played':''}" onclick="toggleStatus(${g.id}, event)" aria-label="${played?'遊んだ済み':'遊ぶべき'}">
        ${played ? ICON_CHECK : ICON_CLOCK}
      </div>
    </div>`;
  });

  const mainSvg = `<svg class="lines" width="${contentWidth}" height="${MAIN_ROW_H}">${mainAxisSvg}</svg>`;
  const mainRowInner = document.getElementById('mainRowInner');
  mainRowInner.style.width = contentWidth + 'px';
  mainRowInner.style.height = MAIN_ROW_H + 'px';
  mainRowInner.innerHTML = mainSvg + mainNodesHtml;

  // ---- 下段（後継作スクロール領域）: 各系列の縦線+カードを描画。上端(y=0)を軸の位置とする ----
  const branchAreaHeight = laneCount * BRANCH_ROW_H + 30;
  let branchSvg = '';
  let branchNodesHtml = '';

  allBranches.forEach(b => {
    const dy = b.lane * BRANCH_ROW_H + 20;
    const dotYb = dy + 8;
    const parentId = sorted[b.seriesIndex].id;
    const isActive = activeFilter.size === 0 || activeFilter.has(parentId);

    branchSvg += `
      <line x1="${b.x}" y1="0" x2="${b.x}" y2="${dotYb - 6}"
        stroke="${b.color}" stroke-width="1.6" opacity="${isActive ? 0.8 : 0.12}" />
    `;

    branchNodesHtml += `<div class="branch-node ${isActive ? '' : 'dimmed'}" style="left:${b.x}px; top:${dy}px;" onclick="openBranchDetail(${parentId}, ${b.year}, event)">
      <div class="branch-dot" style="background:${b.color}"></div>
      <div class="branch-card" style="border-top-color:${b.color}">
        <div class="branch-year">${b.year}</div>
        <div class="branch-title">${esc(b.title)}</div>
        <div class="branch-note">${esc(b.note)}</div>
      </div>
    </div>`;
  });

  const branchSvgWrap = `<svg class="lines" width="${contentWidth}" height="${branchAreaHeight}">${branchSvg}</svg>`;
  const branchAreaInner = document.getElementById('branchAreaInner');
  branchAreaInner.style.width = contentWidth + 'px';
  branchAreaInner.style.height = branchAreaHeight + 'px';
  branchAreaInner.innerHTML = branchSvgWrap + branchNodesHtml;

  // ---- header高さに応じて本流固定行のtop位置を調整 ----
  const headerEl = document.querySelector('header');
  const mainOuterEl = document.getElementById('mainRowOuter');
  if(headerEl && mainOuterEl){
    mainOuterEl.style.top = headerEl.offsetHeight + 'px';
  }

  // ---- 横スクロール位置を上段・下段で同期する（rAFで間引き、慣性スクロールを妨げない） ----
  const mainOuter = document.getElementById('mainRowOuter');
  const branchOuter = document.getElementById('branchAreaOuter');
  if(!mainOuter.dataset.synced){
    mainOuter.dataset.synced = '1';
    let ticking = false;
    let source = null;

    function syncScroll(from, to){
      if(ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        to.scrollLeft = from.scrollLeft;
        ticking = false;
      });
    }

    mainOuter.addEventListener('scroll', () => {
      if(source === 'branch') return;
      source = 'main';
      syncScroll(mainOuter, branchOuter);
    }, { passive: true });

    branchOuter.addEventListener('scroll', () => {
      if(source === 'main') return;
      source = 'branch';
      syncScroll(branchOuter, mainOuter);
    }, { passive: true });

    // スクロールが止まったら発生源をリセットし、次のジェスチャーをどちらからでも受け付ける
    let resetTimer;
    const resetSource = () => {
      clearTimeout(resetTimer);
      resetTimer = setTimeout(() => { source = null; }, 120);
    };
    mainOuter.addEventListener('scroll', resetSource, { passive: true });
    branchOuter.addEventListener('scroll', resetSource, { passive: true });
  }
}

render();
window.addEventListener('resize', () => {
  const headerEl = document.querySelector('header');
  const mainOuterEl = document.getElementById('mainRowOuter');
  if(headerEl && mainOuterEl) mainOuterEl.style.top = headerEl.offsetHeight + 'px';
});
</script>
</body>
</html>
